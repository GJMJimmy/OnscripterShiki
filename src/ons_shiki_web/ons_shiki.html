        <script type="text/javascript"> // browser universe function
            function scale_full(docobj, ratio=0) {
                var w = window.innerWidth;
                var h = window.innerHeight;
                if(ratio>0) {
                    if(w/h > ratio) {
                        docobj.style.width  = h * ratio  + "px";
                        docobj.style.height = h + "px";
                    }
                    else {
                        docobj.style.width  = w  + "px";
                        docobj.style.height = w / ratio + "px";
                    }
                }
                else {
                    docobj.style.width  = w + "px";
                    docobj.style.height = h + "px";
                }
                return {w: docobj.style.width, h: docobj.style.height}
            }
            
            async function delay(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            async function send_worker(worker, data) {
                worker.postMessage(data);
                return new Promise((res)=>{
                    worker.onmessage = (event)=>{
                        res(event.data);
                    };
                })
            };

            async function load_json(url) {
                return new Promise((res)=>{
                    fetch(url).then((res)=>res.json())
                    .then((json)=>(res(json)));
                })
            }

            async function load_js(url) {
                var script = document.createElement('script');
                script.type = "text/javascript";
                script.src = url;
                document.getElementsByTagName("body")[0].appendChild(script);
                return new Promise((res)=>{
                    script.onload = () =>{
                        res(1);
                    }
                })
            }

            async function download_data (name, data) {
                var blob = new Blob([data], {type:'application/octet-stream'});
                var e = document.createEvent('MouseEvents');
                var a = document.createElement('a');
                a.download = name;
                a.href = window.URL.createObjectURL(blob);
                a.dataset.downloadurl = ['application/octet-stream', a.download, a.href].join(':');
                e.initMouseEvent('click', true, false, window, 0, 0, 0, 0, 0, false, false, false, false, 0, null);
                a.dispatchEvent(e);
            }

            async function upload_data() {
                return new Promise((res, rej) => {
                    var i = document.createElement('input');
                    i.type = 'file';
                    i.addEventListener('change', () => {
                        var file = i.files[0];
                        var reader = new FileReader();
                        reader.onload = (e) => {
                            return res(e.target.result)
                        };
                        reader.readAsArrayBuffer(file);
                    });
                    i.click(); //can not open without user click
                });
            }
        </script>
        
        <script type="text/javascript" src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
        <script type="text/javascript"> // onsyuri web function 
            function em_mkdirs(_FS, path) {
                var tmpdir="";
                var arr = path.split('/');
                for(i in arr)
                {
                    tmpdir += arr[i] +"/";
                    if(arr[i]=="") continue;
                    try{
                        _FS.mkdir(tmpdir);
                    }
                    catch{};
                }
            }

            function em_lsfiles(_FS, top) {
                var files = [];
                var paths = _FS.readdir(top);
                for(let i=0; i < paths.length; i++) {
                    paths[i] = top + "/" + paths[i];
                }
                while(paths.length > 0) {
                    path = paths.pop();
                    if(path.endsWith(".") || path.endsWith("..")) continue;
                    const stat = _FS.stat(path);
                    if (_FS.isDir(stat.mode)) {
                        let tmppaths = _FS.readdir(path);
                        for (let i=0; i<tmppaths.length; i++) {
                            paths.push(path + "/" + tmppaths[i]);
                        }
                    }
                    else if (_FS.isFile(stat.mode)) {
                        files.push(path);   
                    }
                    else if (_FS.isLink(stat.mode)) {
                        // not consider symbol link here
                    }
                }
                return files;
            }

            // zip the given fs paths, return a promise of the zip bytes
            function em_zip_paths(_FS, paths) {
                var zip = new JSZip();
                for (let i=0; i<paths.length; i++) {
                    var data = _FS.readFile(paths[i]);
                    zip.file(paths[i], data, {binary: true});
                    console.log("## onsyuri_fs: em_zip_paths", paths[i]);
                }
                return zip.generateAsync({type : "arraybuffer"});
            }

            function em_export(_FS, paths, name="export.zip") {
                em_zip_paths(_FS, paths)
                .then(function(data) {
                    download_data(name, data);
                });
            }

            function em_import(_FS, data) {
                // must resolve only after every file is written, so callers can
                // safely persist (syncfs) or reload right after awaiting it
                return JSZip.loadAsync(data)
                .then((zip) => {
                    var writes = [];
                    zip.forEach((path, obj) => {
                        if(obj.dir) {
                            em_mkdirs(_FS, path);
                        }
                        else {
                            writes.push(obj.async("arraybuffer")
                            .then((buf) => {
                                _FS.writeFile(path, new Uint8Array(buf));
                                console.log("## onsyuri_fs: em_import", path);
                            }));
                        }
                    });
                    return Promise.all(writes);
                })
            }

            // mount --gamedir other by preload or lazyload
            function mount_game(_FS, gamedir, files, urlbase="", lazyload=false) {
                console.log("## onsyuri_fs: mount_onsgame", gamedir);
                var filemap = {}
                
                if(gamedir[gamedir.length-1] =="/" ) 
                    gamedir=gamedir.substring(0, gamedir.length-1);

                if(urlbase[urlbase.length-1] == "/")
                    urlbase=urlbase.substring(0, urlbase.length-1);

                for(i in files) {
                    var path = files[i].path;
                    var url = files[i].url;
                    var file_lazyload = files[i].lazyload;
                    var j = path.lastIndexOf("/");
                    var filename =path.substring(j+1);
                    var filedir = path.substring(0, j);
                    var basedir = gamedir + "/" + filedir;
                    if(basedir[basedir.length-1]!="/") basedir+="/";
                    if(url==undefined || url.length==0)
                    {
                        if (path[0]=="/") url = urlbase + path;
                        else url = urlbase + "/" + path;
                    }

                    // console.log(path, url, file_lazyload);
                    em_mkdirs(_FS, basedir);
                    if(file_lazyload==undefined) file_lazyload = lazyload;
                    if(file_lazyload){ // pay attension to the case sensitive!
                        var key = basedir + filename;
                        // 引擎用小写 key 查表，但之后仍按原始大小写 fopen 重开；
                        // 所以下载完必须写到原始路径，否则大写目录（如 【ONS】Ever17）会 ENOENT
                        filemap[key.toLowerCase()] = {url: url, loaded:false, path: key};
                    }
                    else {
                        _FS.createPreloadedFile(basedir, filename, url, true, false);
                    }
                }
                return filemap;
            }

            // mount --gamedir using BrowserFS with lazyload, 
            // deprecated as sync block sound problems
            function mount_game2(_module, gamedir, lazyindex, urlbase) {
                console.log("## onsyuri_fs: mount_onsgame2", gamedir);
                var _FS=_module.FS;
                _module.addRunDependency("onsgamefs");
                
                var brewfs =  new BrowserFS.FileSystem.MountableFileSystem();
                var xhrfs = new BrowserFS.FileSystem.XmlHttpRequest(lazyindex, urlbase);
                window.xhrfs = xhrfs;
                window.brewfs = brewfs;
                brewfs.mount('/xhrfs', xhrfs);
                BrowserFS.initialize(brewfs);
                var BREWFS = new BrowserFS.EmscriptenFS(_module.FS, _module.PATH); 
                
                em_mkdirs(_FS, gamedir);
                _FS.mount(BREWFS, {root: "/xhrfs"}, gamedir);
                _module.removeRunDependency("onsgamefs")
            }

            // mount --savedir using IDBFS
            function mount_save(_FS, _IDBFS, savedir) {
                console.log("## onsyuri_fs: mount_onssave", savedir);
                em_mkdirs(_FS, savedir);
                _FS.mount(_IDBFS, {}, savedir);
                _FS.syncfs(true, (err)=>{
                    if(err) console.log(err);
                });
            }
        </script>
        
        <script type="text/javascript"> // onsyuri C interface of val or function
            
            // flush the savedir to IDFBFS for persistence
            function flush_save() { 
                g_onsyuri_module.FS.syncfs(false, (err)=>{
                    if(err) console.log(err);
                    else console.log("## onsyuri_fs: flush_save, sync finished");
                });
            }

            // fetch file from the remote server, and write them to local fs
            async function fetch_file(_FS, path, filemap) {
                var fnode = filemap[path];
                return new Promise((res)=>{
                    if(!fnode){
                        res(0);
                    }
                    else{
                        if(fnode.loaded) res(1);
                        // path is the lowercased lookup key; fnode.path keeps the original case
                        var target = fnode.path || path;
                        fetch(fnode.url).then( (resp)=>{
                            return resp.arrayBuffer();
                        }).then((data)=>{
                            em_mkdirs(_FS, target.substring(0, target.lastIndexOf("/") + 1));
                            _FS.writeFile(target, new Uint8Array(data));
                            fnode.loaded = true;
                            res(1);
                        }).catch((err)=>{
                            console.log("## fetch_file " + target, err);
                            res(-1);
                        })
                    }
                })
            }
    
            const ONSYURI_PREFIX = ""; // prefix for mount, not used 
            const ONSYURI_INDEX_URL = document.querySelector( // the url to load onsyuri_index.json
                'meta[onsyuri_index]').attributes.onsyuri_index.textContent;
            const ONSYURI_JS_URL = document.querySelector(
                'meta[onsyuri_js]').attributes.onsyuri_js.textContent;
            var g_onsyuri_index = {}; // onsyuri_index.json, game file index
            var g_onsyuri_filemap = {}; // filemap to record status of loaded files, used for lazyload
            var g_onsyuri_module  = {}; // onsyuri c module, FS and configure are here

        </script>

        <script type="text/javascript"> // onsyuri module
            g_onsyuri_module.canvas = (()=>{return document.getElementById('canvas');})();
            g_onsyuri_module.preRun = () => {
                console.log("## onsyuri: preRun");
                var lazyload = false;
                var urlbase = window.location.href;
                urlbase = urlbase.substring(0, urlbase.lastIndexOf("/") + 1);
                
                // lazyindex is deprecated as the sync sound problem
                if(g_onsyuri_index.lazyindex && g_onsyuri_index.lazyindex!=""){
                    mount_onsgame2(g_onsyuri_module, g_onsyuri_index.gamedir, 
                        g_onsyuri_index.lazyindex, urlbase);
                }
                else{
                    lazyload = g_onsyuri_index.lazyload||lazyload;
                    window.g_onsyuri_filemap = mount_game(
                        g_onsyuri_module.FS, g_onsyuri_index.gamedir, 
                        g_onsyuri_index.files, urlbase, lazyload
                    );
                }
                mount_save(g_onsyuri_module.FS, g_onsyuri_module.IDBFS, g_onsyuri_index.savedir);
            };
            g_onsyuri_module.onRuntimeInitialized = () => {
                console.log("## onsyuri: onRuntimeInitialized");
            };
            
            (async() => {
                //return
                g_onsyuri_index = await load_json(ONSYURI_INDEX_URL);
                await load_js(ONSYURI_JS_URL); // dynamic load onsyuri.js
                await onsyuri(g_onsyuri_module);

                var args = [
                    "--root", ONSYURI_PREFIX + g_onsyuri_index.gamedir, 
                    "--font",  ONSYURI_PREFIX + g_onsyuri_index.gamedir + "/default.ttf", 
                    "--save-dir", g_onsyuri_index.savedir
                ];
                args = args.concat(g_onsyuri_index.args);
                console.log("## onsyuri: args", args);
                g_onsyuri_module.callMain(args);
            })();
        </script>

        <script type="text/javascript"> // onsyuri ui
            var g_fullstrech = false;
            var g_screen_height, g_screen_width; // initial in onsyuri C code

            function toggle_stretchfull() {
                g_fullstrech = !g_fullstrech;
                window.dispatchEvent(new Event('resize'));
            }

            function toggle_screenfull() {
                var body = document.getElementsByTagName('body')[0];
                if(window.innerHeight != screen.height) {
                    body.requestFullscreen({ navigationUI: "show" })
                    .then(()=>{ // can not use canvas.requestFullscreen
                        console.log("## after requestFullscreen");
                    });
                }
                else {
                    document.exitFullscreen();
                }
            }

            function toggle_onsmenu(){
                // simulate a real right click: some games swap the ESC semantics
                // with useescspc, but a right click always opens the game menu
                var canvas = document.getElementById('canvas');
                var rect = canvas.getBoundingClientRect();
                var init = {bubbles: true, cancelable: true, button: 2, buttons: 2,
                    clientX: rect.left + rect.width / 2,
                    clientY: rect.top + rect.height / 2};
                canvas.dispatchEvent(new MouseEvent("mousedown", init));
                setTimeout(() => {
                    init.buttons = 0; // no button held on release
                    canvas.dispatchEvent(new MouseEvent("mouseup", init));
                }, 50);
            }

            var g_skip = false;
            function toggle_skip() {
                g_skip = !g_skip;
                var canvas = document.getElementById('canvas');
                var event = new KeyboardEvent(g_skip ? "keydown": "keyup",
                    {bubbles: true, cancelable: true, key: "Control", code: "ControlLeft",
                    keyCode: 0x11}); // ctrl key
                canvas.dispatchEvent(event);
            }

            function toggle_webinfo() {
                var onsyuri_webinfo = document.getElementById("onsyuri_webinfo");
                if(onsyuri_webinfo.style.display=="none") {
                    var first_line = onsyuri_webinfo.getElementsByTagName("p")[0];
                    first_line.innerText = `In Game <${g_onsyuri_index.title}>`
                    onsyuri_webinfo.style.display="block";
                }
                else{
                    onsyuri_webinfo.style.display="none";
                }
            }

            function toggle_webmenu() {
                var onsyuri_webrmenu = document.getElementById("onsyuri_webrmenu");
                var fab = get_fab();
                if(onsyuri_webrmenu.style.display=="none") {
                    build_menu();
                    onsyuri_webrmenu.style.display = "block";
                    if (g_ui_mode == "sidebar") {
                        // 侧边栏模式没有悬浮球可依附，面板居中显示
                        onsyuri_webrmenu.classList.add("ons-panel-center");
                        center_panel(onsyuri_webrmenu);
                    }
                    else {
                        menu_place_panel(); // measure after shown, position before paint
                    }
                    if(fab) fab.classList.add("open");
                }
                else {
                    var onsyuri_webinfo = document.getElementById("onsyuri_webinfo");
                    onsyuri_webinfo.style.display = "none";
                    onsyuri_webrmenu.style.display = "none";
                    if(fab) fab.classList.remove("open");
                }
            }

            // ---- floating action button: click to toggle menu, drag to move ----
            const FAB_DRAG_THRESHOLD = 6;
            var g_fab_pos = null; // {left, top} in css pixels
            var g_fab_drag = {active: false, moved: false, id: -1, x: 0, y: 0, left: 0, top: 0};

            function get_fab() {
                return document.getElementById("onsyuri_fab");
            }

            function menu_is_shown() {
                var panel = document.getElementById("onsyuri_webrmenu");
                return !!panel && panel.style.display != "none";
            }

            function fab_default_pos(fab) {
                return {left: window.innerWidth - fab.offsetWidth - 16, top: 16};
            }

            function fab_clamp_pos(pos) {
                var fab = get_fab();
                pos.left = Math.max(0, Math.min(pos.left, window.innerWidth - fab.offsetWidth));
                pos.top  = Math.max(0, Math.min(pos.top,  window.innerHeight - fab.offsetHeight));
                return pos;
            }

            function fab_apply_pos() {
                var fab = get_fab();
                fab.style.left = g_fab_pos.left + "px";
                fab.style.top  = g_fab_pos.top + "px";
                fab.style.right = "auto"; // left takes over once js positions the fab
            }

            function fab_load_pos() {
                var fab = get_fab();
                g_fab_pos = fab_default_pos(fab);
                try {
                    var pos = JSON.parse(localStorage.getItem("onsyuri_fab_pos"));
                    if(pos && typeof pos.left=="number" && typeof pos.top=="number")
                        g_fab_pos = pos;
                }
                catch(e) {} // localStorage unavailable, keep the default position
                fab_clamp_pos(g_fab_pos);
                fab_apply_pos();
            }

            function fab_save_pos() {
                try { localStorage.setItem("onsyuri_fab_pos", JSON.stringify(g_fab_pos)); }
                catch(e) {}
            }

            // popup the panel beside the fab, flipping at the screen edges
            function menu_place_panel() {
                var panel = document.getElementById("onsyuri_webrmenu");
                var fab = get_fab();
                if(!g_fab_pos) fab_load_pos();
                var margin = 8;
                var pw = panel.offsetWidth, ph = panel.offsetHeight;
                var left = (g_fab_pos.left + fab.offsetWidth / 2 > window.innerWidth / 2) ?
                    g_fab_pos.left - pw - margin : g_fab_pos.left + fab.offsetWidth + margin;
                var top = (g_fab_pos.top + fab.offsetHeight + ph + margin < window.innerHeight) ?
                    g_fab_pos.top : g_fab_pos.top + fab.offsetHeight - ph;
                left = Math.max(margin, Math.min(left, window.innerWidth - pw - margin));
                top  = Math.max(margin, Math.min(top,  window.innerHeight - ph - margin));
                panel.style.left = left + "px";
                panel.style.top  = top + "px";
            }

            function fab_init() {
                var fab = get_fab();
                if(!fab) return;
                // 版本号统一由 <meta name="ons_version"> 驱动
                document.title = "OnscripterShiki " + ONS_VERSION;
                var verLabel = document.getElementById("ons_version_label");
                if(verLabel) verLabel.textContent = ONS_VERSION;
                theme_load();
                fab_load_pos();
                // 键盘隔离：输入控件中的按键不冒泡到 window。
                // SDL 的 window 级 keydown 会无条件 preventDefault（游戏未开启
                // SDL 文本输入），否则桌面端在输入框里打不出字
                var panel = document.getElementById("onsyuri_webrmenu");
                ["keydown", "keyup", "keypress"].forEach((type) => {
                    panel.addEventListener(type, (event) => {
                        var t = event.target;
                        if (t && (t.tagName == "INPUT" || t.tagName == "TEXTAREA" ||
                                  t.tagName == "SELECT" || t.isContentEditable))
                            event.stopPropagation();
                    }, true);
                });
                offline_register();
                fab.addEventListener("pointerdown", (event)=>{
                    if(!event.isPrimary) return;
                    g_fab_drag = {active: true, moved: false, id: event.pointerId,
                        x: event.clientX, y: event.clientY,
                        left: g_fab_pos.left, top: g_fab_pos.top};
                    get_fab().setPointerCapture(event.pointerId);
                });
                fab.addEventListener("pointermove", (event)=>{
                    var drag = g_fab_drag;
                    if(!drag.active || event.pointerId != drag.id) return;
                    var dx = event.clientX - drag.x, dy = event.clientY - drag.y;
                    if(!drag.moved && Math.hypot(dx, dy) < FAB_DRAG_THRESHOLD) return;
                    drag.moved = true;
                    g_fab_pos = fab_clamp_pos({left: drag.left + dx, top: drag.top + dy});
                    fab_apply_pos();
                    if(menu_is_shown()) menu_place_panel(); // panel follows the fab while dragging
                });
                fab.addEventListener("pointerup", (event)=>{
                    var drag = g_fab_drag;
                    if(!drag.active || event.pointerId != drag.id) return;
                    g_fab_drag = {active: false, moved: false, id: -1, x: 0, y: 0, left: 0, top: 0};
                    if(drag.moved) fab_save_pos();
                    else toggle_webmenu();
                });
                fab.addEventListener("pointercancel", ()=>{
                    g_fab_drag = {active: false, moved: false, id: -1, x: 0, y: 0, left: 0, top: 0};
                });
            }
            document.addEventListener("DOMContentLoaded", fab_init);

            function click_export() {
                var files = em_lsfiles(g_onsyuri_module.FS, g_onsyuri_index.savedir);
                em_export(g_onsyuri_module.FS, files);
            }

            async function click_import() {
                var data = await upload_data();
                em_import(g_onsyuri_module.FS, data);
            }

            // ---- appearance customization ----
            const ONS_THEME_KEY = "onsyuri_ui_theme";
            const ONS_THEME_DEFAULT = {
                color: "#38bdf8", fabAlpha: 0.92, panelAlpha: 0.82,
                mode: "sidebar", sideAlpha: 0.78,
                btnColor: "#ffffff", activeColor: "#ff6fb1"
            };

            function ons_hex_rgb(hex) {
                hex = String(hex || "#38bdf8").replace("#", "");
                if (hex.length == 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
                var n = parseInt(hex, 16);
                if (isNaN(n)) n = 0x38bdf8;
                return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
            }
            function ons_rgba(hex, a) {
                var c = ons_hex_rgb(hex);
                return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")";
            }
            function ons_shade(hex, t) { // 向深蓝混合，替代 color-mix（WebView 99 不支持）
                var c = ons_hex_rgb(hex), target = [12, 74, 110];
                return "rgb(" + Math.round(c[0] + (target[0]-c[0])*t) + "," +
                                Math.round(c[1] + (target[1]-c[1])*t) + "," +
                                Math.round(c[2] + (target[2]-c[2])*t) + ")";
            }

            function apply_theme(theme) {
                var root = document.documentElement.style;
                root.setProperty("--ons-accent", theme.color);
                root.setProperty("--ons-fab-alpha", String(theme.fabAlpha));
                root.setProperty("--ons-panel-alpha", String(theme.panelAlpha));
                root.setProperty("--ons-side-alpha", String(theme.sideAlpha));
                root.setProperty("--ons-side-btn", theme.btnColor);
                root.setProperty("--ons-side-active", theme.activeColor);
                root.setProperty("--ons-accent-deep", ons_shade(theme.color, .45));
                root.setProperty("--ons-accent-weak", ons_rgba(theme.color, .15));
                root.setProperty("--ons-accent-glow", ons_rgba(theme.color, .35));
                root.setProperty("--ons-accent-glow-2", ons_rgba(theme.color, .5));
                apply_ui_mode(theme.mode);
            }

            function theme_load() {
                var theme = {}, k;
                for (k in ONS_THEME_DEFAULT) theme[k] = ONS_THEME_DEFAULT[k];
                try {
                    var saved = JSON.parse(localStorage.getItem(ONS_THEME_KEY));
                    if (saved && typeof saved == "object") {
                        for (k in ONS_THEME_DEFAULT)
                            if (saved[k] !== undefined && saved[k] !== null) theme[k] = saved[k];
                    }
                } catch(e) {} // keep defaults on broken storage
                apply_theme(theme);
                return theme;
            }

            function theme_save(theme) {
                try { localStorage.setItem(ONS_THEME_KEY, JSON.stringify(theme)); } catch(e) {}
            }

            async function clear_site_cache() {
                show_toast("正在清理缓存…", "info", 60000);
                try {
                    var keys = await caches.keys();
                    await Promise.all(keys.map(function(k){ return caches.delete(k); }));
                } catch(e) {}
                try {
                    var regs = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(regs.map(function(r){ return r.unregister(); }));
                } catch(e) {}
                try { localStorage.removeItem("onsyuri_offline_done"); } catch(e) {}
                location.reload();
            }

            function show_theme_view() {
                var theme = theme_load();
                var panel = document.getElementById("onsyuri_webrmenu");
                var modeSide = theme.mode != "fab";
                panel.innerHTML =
                    '<div class="ons-group">' +
                        '<div class="ons-label">界面</div>' +
                        '<div class="ons-seg" id="ons_mode_seg">' +
                            '<button class="ons-seg-btn' + (modeSide ? ' active' : '') + '" data-mode="sidebar">侧边栏</button>' +
                            '<button class="ons-seg-btn' + (modeSide ? '' : ' active') + '" data-mode="fab">悬浮球</button>' +
                        '</div>' +
                        '<div class="ons-label">外观设置</div>' +
                        '<div class="ons-field"><span>主色调</span>' +
                        '<input id="ons_theme_color" class="ons-color" type="color" value="' + theme.color + '"></div>' +
                        '<div class="ons-field"><span>按键颜色</span>' +
                        '<input id="ons_theme_btn" class="ons-color" type="color" value="' + theme.btnColor + '"></div>' +
                        '<div class="ons-field"><span>触发后按键颜色</span>' +
                        '<input id="ons_theme_active" class="ons-color" type="color" value="' + theme.activeColor + '"></div>' +
                        '<div class="ons-field"><span>侧边栏透明度 <b id="ons_side_alpha_val">' + Math.round(theme.sideAlpha*100) + '%</b></span>' +
                        '<input id="ons_theme_side" class="ons-range" type="range" min="10" max="100" step="1" value="' + Math.round(theme.sideAlpha*100) + '"></div>' +
                        '<div class="ons-field"><span>悬浮球透明度 <b id="ons_fab_alpha_val">' + Math.round(theme.fabAlpha*100) + '%</b></span>' +
                        '<input id="ons_theme_fab" class="ons-range" type="range" min="30" max="100" step="1" value="' + Math.round(theme.fabAlpha*100) + '"></div>' +
                        '<div class="ons-field"><span>面板透明度 <b id="ons_panel_alpha_val">' + Math.round(theme.panelAlpha*100) + '%</b></span>' +
                        '<input id="ons_theme_panel" class="ons-range" type="range" min="30" max="100" step="1" value="' + Math.round(theme.panelAlpha*100) + '"></div>' +
                        '<div class="ons-row">' +
                        '<button class="ons-btn ons-btn-ghost" id="ons_theme_reset">' + ONS_ICONS.sync + '<span>恢复默认</span></button>' +
                        '<button class="ons-btn ons-btn-ghost" id="ons_cache_clear">' + ONS_ICONS.trash + '<span>清空缓存</span></button>' +
                        '</div>' +
                        '<button class="ons-item" id="ons_theme_back">' + ONS_ICONS.back + '<span>返回</span></button>' +
                    '</div>';
                var segBtns = document.querySelectorAll("#ons_mode_seg .ons-seg-btn");
                function current() {
                    var mode = "sidebar";
                    for (var i = 0; i < segBtns.length; i++)
                        if (segBtns[i].classList.contains("active")) mode = segBtns[i].getAttribute("data-mode");
                    return {
                        color: document.getElementById("ons_theme_color").value,
                        btnColor: document.getElementById("ons_theme_btn").value,
                        activeColor: document.getElementById("ons_theme_active").value,
                        sideAlpha: document.getElementById("ons_theme_side").value/100,
                        fabAlpha: document.getElementById("ons_theme_fab").value/100,
                        panelAlpha: document.getElementById("ons_theme_panel").value/100,
                        mode: mode
                    };
                }
                function apply() {
                    var t = current();
                    apply_theme(t);
                    document.getElementById("ons_side_alpha_val").textContent = Math.round(t.sideAlpha*100) + "%";
                    document.getElementById("ons_fab_alpha_val").textContent = Math.round(t.fabAlpha*100) + "%";
                    document.getElementById("ons_panel_alpha_val").textContent = Math.round(t.panelAlpha*100) + "%";
                    theme_save(t);
                }
                ["ons_theme_color","ons_theme_btn","ons_theme_active"].forEach(function(id){
                    document.getElementById(id).addEventListener("input", apply);
                });
                ["ons_theme_side","ons_theme_fab","ons_theme_panel"].forEach(function(id){
                    document.getElementById(id).addEventListener("input", apply);
                });
                for (var i = 0; i < segBtns.length; i++) {
                    segBtns[i].addEventListener("click", function(){
                        for (var j = 0; j < segBtns.length; j++) segBtns[j].classList.remove("active");
                        this.classList.add("active");
                        apply();
                    });
                }
                document.getElementById("ons_theme_reset").addEventListener("click", function(){
                    localStorage.removeItem(ONS_THEME_KEY);
                    apply_theme(ONS_THEME_DEFAULT);
                    show_theme_view();
                });
                document.getElementById("ons_cache_clear").addEventListener("click", clear_site_cache);
                document.getElementById("ons_theme_back").addEventListener("click", build_menu);
            }

            var g_toast_timer = 0;
            function show_toast(msg, type="info", ms=2800) {
                var t = document.getElementById("onsyuri_toast");
                if(!t) {
                    t = document.createElement("div");
                    t.id = "onsyuri_toast";
                    document.body.appendChild(t);
                }
                t.textContent = msg;
                t.className = "ons-toast show " + type;
                clearTimeout(g_toast_timer);
                g_toast_timer = setTimeout(()=>{ t.className = "ons-toast " + type; }, ms);
            }

            function build_menu() {
                var panel = document.getElementById("onsyuri_webrmenu");
                panel.innerHTML = "";
                var groups = [
                    {label: "游戏", items: [
                        {icon: "menu", label: "菜单/返回", onclick: toggle_onsmenu},
                        {icon: "skip", label: "快进", badge: "Ctrl", onclick: toggle_skip},
                    ]},
                    {label: "云同步", items: [
                        {icon: "sync", label: "上传 / 恢复存档", onclick: show_sync_view},
                    ]},
                    {label: "存档文件", items: [
                        {icon: "export", label: "导出存档", badge: "F3", onclick: click_export},
                        {icon: "import", label: "导入存档", badge: "F4", onclick: click_import},
                    ]},
                    {label: "离线", items: [
                        {icon: "download", label: "缓存全部资源", onclick: offline_precache},
                        {icon: "trash", label: "清除离线缓存", onclick: offline_clear},
                        {icon: "trash", label: "清空缓存并刷新", onclick: clear_site_cache},
                    ]},
                    {label: "外观", items: [
                        {icon: "droplet", label: "外观设置", onclick: show_theme_view},
                    ]},
                    {label: "系统", items: [
                        {icon: "stretch", label: "拉伸全屏", badge: "F10", onclick: toggle_stretchfull},
                        {icon: "full", label: "全屏", badge: "F11", onclick: toggle_screenfull},
                        {icon: "about", label: "关于", badge: "F2", onclick: toggle_webinfo},
                        {icon: "close", label: "关闭面板", badge: "F9", onclick: toggle_webmenu},
                    ]},
                ];
                groups.forEach((group)=>{
                    var groupDiv = document.createElement("div");
                    groupDiv.className = "ons-group";
                    if(group.label) {
                        var label = document.createElement("div");
                        label.className = "ons-label";
                        label.textContent = group.label;
                        groupDiv.appendChild(label);
                    }
                    group.items.forEach((item)=>{
                        var btn = document.createElement("button");
                        btn.className = "ons-item";
                        btn.innerHTML = ONS_ICONS[item.icon] +
                            "<span>" + item.label + "</span>" +
                            (item.badge ? '<span class="ons-badge">' + item.badge + '</span>' : "");
                        btn.addEventListener("click", item.onclick);
                        groupDiv.appendChild(btn);
                    });
                    panel.appendChild(groupDiv);
                });
            }

            function show_sync_view() {
                var panel = document.getElementById("onsyuri_webrmenu");
                panel.innerHTML =
                    '<div class="ons-group">' +
                        '<div class="ons-label">云同步存档</div>' +
                        '<div class="ons-field"><span>服务器链接</span>' +
                        '<input id="ons_sync_server" class="ons-input" spellcheck="false" placeholder="http://192.168.1.10:8765"></div>' +
                        '<div class="ons-field"><span>存档码</span>' +
                        '<input id="ons_sync_slot" class="ons-input" spellcheck="false" placeholder="给这份存档起个名字"></div>' +
                        '<div class="ons-row">' +
                        '<button class="ons-btn ons-btn-primary" id="ons_sync_up">' + ONS_ICONS.up + '<span>上传</span></button>' +
                        '<button class="ons-btn ons-btn-ghost" id="ons_sync_down">' + ONS_ICONS.down + '<span>恢复</span></button>' +
                        '</div>' +
                        '<button class="ons-item" id="ons_sync_back">' + ONS_ICONS.back + '<span>返回</span></button>' +
                    '</div>';
                var server = document.getElementById("ons_sync_server");
                var slot = document.getElementById("ons_sync_slot");
                server.value = (typeof ONSYURI_SYNC_SERVER == "string" && ONSYURI_SYNC_SERVER != "") ?
                    ONSYURI_SYNC_SERVER : (localStorage.getItem("onsyuri_sync_server") || "");
                slot.value = localStorage.getItem("onsyuri_sync_slot") || "";
                document.getElementById("ons_sync_up").addEventListener("click", ()=>{ run_sync("upload"); });
                document.getElementById("ons_sync_down").addEventListener("click", ()=>{ run_sync("download"); });
                document.getElementById("ons_sync_back").addEventListener("click", build_menu);
            }

            function run_sync(mode) {
                var server = document.getElementById("ons_sync_server").value.trim().replace(/\/+$/, "");
                var slot = document.getElementById("ons_sync_slot").value.trim();
                if(server == "") { show_toast("请先填写服务器链接", "warning"); return; }
                if(slot == "") { show_toast("请先输入存档码", "warning"); return; }
                localStorage.setItem("onsyuri_sync_server", server);
                localStorage.setItem("onsyuri_sync_slot", slot);
                hide_webmenu(); // toasts keep the user informed
                if(mode == "upload") do_upload(server, slot);
                else do_download(server, slot);
            }

            function hide_webmenu() {
                var panel = document.getElementById("onsyuri_webrmenu");
                panel.style.display = "none";
                panel.classList.remove("ons-panel-center");
                document.getElementById("onsyuri_webinfo").style.display = "none";
                var fab = get_fab();
                if(fab) fab.classList.remove("open");
            }

            async function do_upload(server, slot) {
                try {
                    var files = em_lsfiles(g_onsyuri_module.FS, g_onsyuri_index.savedir);
                    if(files.length == 0) { show_toast("没有可上传的存档", "warning"); return; }
                    var data = await em_zip_paths(g_onsyuri_module.FS, files);
                    var resp = await fetch(server + "/save/" + encodeURIComponent(slot),
                        {method: "POST", body: data});
                    if(!resp.ok) throw new Error("HTTP " + resp.status);
                    show_toast("存档已上传到云端（" + slot + "）", "success");
                }
                catch(e) { show_toast("上传失败: " + e.message, "error"); }
            }

            async function do_download(server, slot) {
                try {
                    var resp = await fetch(server + "/save/" + encodeURIComponent(slot));
                    if(resp.status == 404) { show_toast("云端没有 \"" + slot + "\" 的存档", "info"); return; }
                    if(!resp.ok) throw new Error("HTTP " + resp.status);
                    var data = await resp.arrayBuffer();
                    await em_import(g_onsyuri_module.FS, data);
                    flush_save(); // persist the restored saves to IndexedDB
                    show_toast("存档已从云端恢复（" + slot + "），即将刷新页面", "success");
                    setTimeout(()=>{ window.location.reload(); }, 1600);
                }
                catch(e) { show_toast("下载失败: " + e.message, "error"); }
            }

            // ---- sidebar controls（侧边栏，WebView 也可用） ----
            var g_ui_mode = "sidebar";
            var g_skip_hold = false, g_skip_sticky = false, g_skip_sent = false, g_auto_on = false;

            function canvas_key(type, key, code, keyCode) {
                var canvas = document.getElementById("canvas");
                // 注意：new KeyboardEvent(..., {keyCode}) 会忽略 keyCode（只读），
                // Emscripten 取的是 e.keyCode / e.which，必须自己定义可读属性
                var ev;
                try {
                    ev = new KeyboardEvent(type, {bubbles: true, cancelable: true, key: key, code: code});
                }
                catch(err) {
                    ev = document.createEvent("Event");
                    ev.initEvent(type, true, true);
                    ev.key = key;
                    ev.code = code;
                }
                Object.defineProperty(ev, "keyCode", {get: function(){ return keyCode; }});
                Object.defineProperty(ev, "which", {get: function(){ return keyCode; }});
                Object.defineProperty(ev, "charCode", {get: function(){ return 0; }});
                canvas.dispatchEvent(ev);
            }
            function tap_key(key, code, keyCode) {
                canvas_key("keydown", key, code, keyCode);
                canvas_key("keyup", key, code, keyCode);
            }
            function sync_skip_state() {
                var on = g_skip_hold || g_skip_sticky;
                if (on != g_skip_sent) {
                    canvas_key(on ? "keydown" : "keyup", "Control", "ControlLeft", 0x11);
                    g_skip_sent = on;
                }
                var b = document.querySelector('#ons_sidebar .ons-side-btn[data-kind="skip-sticky"]');
                if (b) b.classList.toggle("active", g_skip_sticky);
                var h = document.querySelector('#ons_sidebar .ons-side-btn[data-kind="skip-hold"]');
                if (h) h.classList.toggle("active", g_skip_hold);
            }
            function toggle_auto() {
                tap_key("a", "KeyA", 65);
                g_auto_on = !g_auto_on;
                var b = document.querySelector('#ons_sidebar .ons-side-btn[data-kind="auto"]');
                if (b) b.classList.toggle("active", g_auto_on);
            }
            function center_panel(panel) {
                var w = panel.offsetWidth, h = panel.offsetHeight;
                panel.style.left = Math.max(8, Math.round((window.innerWidth - w) / 2)) + "px";
                panel.style.top = Math.max(8, Math.round((window.innerHeight - h) / 2)) + "px";
            }
            function open_menu_centered() {
                open_panel_centered(build_menu);
            }
            function open_panel_centered(viewFn) {
                var panel = document.getElementById("onsyuri_webrmenu");
                viewFn();
                panel.style.display = "block";
                panel.classList.add("ons-panel-center");
                center_panel(panel);
                var fab = get_fab();
                if (fab) fab.classList.add("open");
            }
            function apply_ui_mode(mode) {
                g_ui_mode = (mode == "fab") ? "fab" : "sidebar";
                document.body.classList.toggle("ons-mode-sidebar", g_ui_mode == "sidebar");
                document.body.classList.toggle("ons-mode-fab", g_ui_mode == "fab");
                var bar = document.getElementById("ons_sidebar");
                if (bar) bar.style.display = (g_ui_mode == "sidebar") ? "block" : "none";
                var fab = get_fab();
                if (fab) fab.style.display = (g_ui_mode == "sidebar") ? "none" : "";
            }
            function build_sidebar() {
                if (document.getElementById("ons_sidebar")) return;
                var bar = document.createElement("div");
                bar.id = "ons_sidebar";

                function mkBtn(kind, icon, title) {
                    var b = document.createElement("button");
                    b.type = "button";
                    b.className = "ons-side-btn";
                    b.title = title;
                    b.setAttribute("data-kind", kind);
                    var ico = document.createElement("i");
                    ico.className = "ons-side-ico";
                    var src = ONS_SIDE_ICONS[icon];
                    if (src) {
                        ico.style.webkitMaskImage = "url(" + src + ")";
                        ico.style.maskImage = "url(" + src + ")";
                    }
                    b.appendChild(ico);
                    return b;
                }

                var left = document.createElement("div");
                left.className = "ons-side left";
                var right = document.createElement("div");
                right.className = "ons-side right";

                var bSync = mkBtn("sync", "upload", "上传 / 同步存档");
                bSync.addEventListener("click", function(){ open_panel_centered(show_sync_view); });
                left.appendChild(bSync);

                var bHold = mkBtn("skip-hold", "runner", "快进（按住生效）");
                bHold.addEventListener("pointerdown", function(e){
                    e.preventDefault();
                    g_skip_hold = true; sync_skip_state();
                    try { bHold.setPointerCapture(e.pointerId); } catch(err) {}
                });
                var hold_end = function(){ if (g_skip_hold) { g_skip_hold = false; sync_skip_state(); } };
                bHold.addEventListener("pointerup", hold_end);
                bHold.addEventListener("pointercancel", hold_end);
                bHold.addEventListener("pointerleave", hold_end);
                left.appendChild(bHold);

                var bSticky = mkBtn("skip-sticky", "skip", "快进（点击切换）");
                bSticky.addEventListener("click", function(){
                    g_skip_sticky = !g_skip_sticky;
                    sync_skip_state();
                });
                left.appendChild(bSticky);

                var bAuto = mkBtn("auto", "play", "自动播放");
                bAuto.addEventListener("click", toggle_auto);
                left.appendChild(bAuto);

                var bSettings = mkBtn("settings", "gear", "设置");

                bUp.addEventListener("click", function(){ tap_key("h", "KeyH", 72); });

                bDown.addEventListener("click", function(){ tap_key("l", "KeyL", 76); });

                bar.appendChild(right);
                document.body.appendChild(bar);

                // 点击画面会取消自动播放（引擎行为），同步按钮状态
                var canvas = document.getElementById("canvas");
                canvas.addEventListener("pointerdown", function(){
                    if (g_auto_on) {
                        g_auto_on = false;
                        var b = document.querySelector('#ons_sidebar .ons-side-btn[data-kind="auto"]');
                        if (b) b.classList.remove("active");
                    }
                });
            }
            document.addEventListener("DOMContentLoaded", build_sidebar);

            // ---- offline cache with a service worker ----
            // 版本号只有一个来源：<meta name="ons_version">，CI 发版时只改这一处
            const ONS_VERSION = ((document.querySelector('meta[name="ons_version"]') || {}).content || "dev").trim();
            var ONS_SW_URL = "ons_shiki_sw.js";
            var ONS_SW_CACHE = "ons_shiki_" + ONS_VERSION;
            var g_offline_running = false;

            function offline_supported() {
                return "serviceWorker" in navigator && "caches" in window &&
                    (location.protocol == "https:" ||
                     location.hostname == "localhost" || location.hostname == "127.0.0.1");
            }

            function offline_register() {
                if(!offline_supported()) return;
                navigator.serviceWorker.register(ONS_SW_URL + "?v=" + encodeURIComponent(ONS_VERSION)).catch((e)=>{
                    console.log("service worker register failed:", e);
                });
            }

            function offline_clear() {
                caches.keys().then((keys)=>{
                    return Promise.all(keys
                        .filter((k) => k.indexOf("ons_shiki_") == 0)
                        .map((k) => caches.delete(k)));
                }).then(()=>{
                    try { localStorage.removeItem("onsyuri_offline_done"); } catch(e) {}
                    show_toast("离线缓存已清除", "info");
                }).catch(()=>{ show_toast("清除失败", "error"); });
            }

            function offline_precache() {
                if(g_offline_running) { show_toast("正在缓存中，请稍候…", "info"); return; }
                if(!offline_supported()) { show_toast("当前环境不支持离线缓存（需 HTTPS 或 localhost）", "warning"); return; }
                if(!g_onsyuri_index || !g_onsyuri_index.files) { show_toast("游戏资源清单尚未加载", "warning"); return; }
                // critical files first: page, engine, scripts, ui art, then bulk data;
                // a partial cache still boots the game offline.
                // 游戏资源可能放在子目录（index 里带 url 字段），一律按 url 取
                var core = ["onsyuri_index.json", "onsyuri.js", "onsyuri.wasm", "ons_shiki_sw.js"];
                var rest = g_onsyuri_index.files
                    .filter((f)=>f && f.path && core.indexOf(f.path) < 0);
                var urlOf = (f)=>f.url || f.path;
                var pull = (pred)=>{ var out = rest.filter((f)=>pred(f.path)).map(urlOf); rest = rest.filter((f)=>!pred(f.path)); return out; };
                var list = [location.pathname].concat(core)
                    .concat(pull((p)=>p.slice(-4) == ".txt"))
                    .concat(pull((p)=>p.indexOf("esystem/") == 0))
                    .concat(pull((p)=>p.indexOf("background/") == 0))
                    .concat(pull((p)=>p.indexOf("foreground/") == 0))
                    .concat(pull((p)=>p.indexOf("music/") == 0))
                    .concat(rest.map(urlOf));
                g_offline_running = true;
                show_toast("离线缓存 0/" + list.length + " …", "info", 3600000);
                var toast = document.getElementById("onsyuri_toast");
                var done = 0, failed = 0, next = 0;
                caches.open(ONS_SW_CACHE).then((cache)=>{
                    var worker = async () => {
                        while(next < list.length) {
                            var p = list[next++];
                            try {
                                // 已缓存的文件直接跳过（缓存按版本号隔离，重复执行近乎瞬时）
                                var hit = await cache.match(p);
                                if (hit) {
                                    done++;
                                    if(done % 20 == 0 || done == list.length)
                                        toast.textContent = "离线缓存 " + done + "/" + list.length + (failed ? "（失败 " + failed + "）" : "") + " …";
                                    continue;
                                }
                                // X-Ons-Precache 告诉 Service Worker 不要再缓存一次，
                                // 避免同一文件被写入 Cache Storage 两遍（这曾是主要瓶颈）
                                var resp = await fetch(p, {
                                    cache: "reload", credentials: "same-origin",
                                    headers: {"X-Ons-Precache": "1"}
                                });
                                if(resp.status == 200) await cache.put(p, resp);
                                else failed++;
                            }
                            catch(e) { failed++; }
                            done++;
                            if(done % 20 == 0 || done == list.length)
                                toast.textContent = "离线缓存 " + done + "/" + list.length +
                                    (failed ? "（失败 " + failed + "）" : "") + " …";
                        }
                    };
                    var workers = [];
                    for(var i = 0; i < 10; i++) workers.push(worker());
                    return Promise.all(workers);
                }).then(()=>{
                    g_offline_running = false;
                    if(failed && done == failed) { show_toast("离线缓存失败，请检查网络", "error"); return; }
                    try { localStorage.setItem("onsyuri_offline_done", String(Date.now())); } catch(e) {}
                    show_toast(failed ? "离线缓存完成（" + failed + " 个文件失败）" : "离线缓存完成，可离线游玩",
                        failed ? "warning" : "success");
                }).catch((e)=>{
                    g_offline_running = false;
                    show_toast("离线缓存失败: " + e.message, "error");
                });
            }

            window.onresize = (event) => {
                var canvas = document.getElementById('canvas');
                var ratio = g_fullstrech ? window.innerWidth/window.innerHeight: g_screen_width/g_screen_height;
                scale_full(canvas, ratio);
                if(g_fab_pos) { // keep the fab inside the window
                    fab_clamp_pos(g_fab_pos);
                    fab_apply_pos();
                }
                if(menu_is_shown()) menu_place_panel();
            };

            window.onkeydown = (event) => {
                switch(event.key) {
                    case "F2":
                        toggle_webinfo();
                        break;
                    case "F3":
                        click_export();
                        break;
                    case "F4":
                        click_import();
                        break;
                    case "F9":
                        toggle_webmenu();
                        break;
                    case "F10":
                        toggle_stretchfull();
                        break;
                    case "F11":
                        toggle_screenfull();
                        break;
                }
            }

            window.onmousedown = null; // menu toggling is fab/hotkey only, no canvas longpress
            window.onmouseup = null;
            window.ontouchstart = null;
            window.ontouchend = null;

            window.onmessage = (evnet)=> {
                console.log("## onsyuri: onmessage ", event.data);
                if(!event.data) return;
                switch(event.data) {
                    case "onsinit":
                        var body = document.getElementsByTagName("body")[0];
                        var onsyuri_webinfo = document.getElementById("onsyuri_webinfo");
                        if(body) body.style.background = "black";
                        if(onsyuri_webinfo) onsyuri_webinfo.style.display = "none";
                        break;
                }
            }
        </script>
        
        <script type="text/javascript"> // onsyuri video 
            const video=document.getElementById("video");

            function videoEnded(){
                g_onsyuri_module.canvas.style.display="block";
                video.style.display="none";
                if (video.src && video.src.startsWith('blob:')) {
                    URL.revokeObjectURL(video.src);
                    video.src='';
                }
                g_onsyuri_module.wait_video=false;
            }

            function playVideo(path, click_flag, loop_flag){
                g_onsyuri_module.wait_video=true;
                const fileData = g_onsyuri_module.FS.readFile(path, {flags:'r',encoding:'binary'});
                const videoBlob = new Blob([fileData.buffer], { type: 'video/mp4' });
                const videoUrl = URL.createObjectURL(videoBlob);
                video.src = videoUrl;

                // measure before hiding the canvas (display:none zeroes its rect)
                var crect = g_onsyuri_module.canvas.getBoundingClientRect();
                g_onsyuri_module.canvas.style.display="none";
                // match the canvas box, otherwise the movie shows at its raw size
                video.style.width = crect.width + "px";
                video.style.height = crect.height + "px";
                video.style.objectFit = "contain";
                video.style.background = "#000";
                video.style.display="block";

                video.onclick=click_flag?videoEnded:null;
                video.loop=loop_flag;

                var p = video.play();
                if (p && p.catch) p.catch((e)=>{ // autoplay policy / codec issues
                    console.log("## playVideo rejected", e && e.name);
                    videoEnded();
                });
            }

            // Jh `mp4` command: the file may not be in the FS yet (lazyload),
            // so fetch it first, then hand over to playVideo.
            async function playVideoLazy(name, click_flag, loop_flag){
                g_onsyuri_module.wait_video = true;
                var path = g_onsyuri_index.gamedir + "/" + name;
                var key = path.toLowerCase();
                try{
                    var fnode = (window.g_onsyuri_filemap || {})[key];
                    if (fnode && !fnode.loaded)
                        await fetch_file(g_onsyuri_module.FS, key, window.g_onsyuri_filemap);
                    playVideo(path, !!click_flag, !!loop_flag);
                }
                catch(e){
                    console.log("## playVideoLazy failed", name, e);
                    g_onsyuri_module.wait_video = false;
                }
            }

            video.addEventListener('error', function(event) {
                console.error('The video failed to load: ', event);
                videoEnded();
            });

        </script>
