# OnscripterYuri 存档同步 Worker —— KV 版配置模板
# 用法：复制本文件为 wrangler.toml（与 worker-kv.js 同目录），
#       填入 namespace id，然后 wrangler deploy

name = "onsyuri-sync-kv"
main = "worker-kv.js"
compatibility_date = "2024-09-01"

[[kv_namespaces]]
binding = "KV"
# id 填 wrangler kv namespace create onsyuri-sync 命令输出的 id
id = "PASTE_NAMESPACE_ID_HERE"

# 可选：防滥用密钥。启用后服务地址为 https://xxx.workers.dev/<SYNC_TOKEN>
# 取消注释并修改即可：
# [vars]
# SYNC_TOKEN = "change-me"
